<div class="minicart-free-shipping" data-bind="visible: isVisible" style="display: none;">
    <div class="free-shipping-progress"
         role="progressbar"
         aria-valuemin="0"
         aria-valuemax="100"
         data-bind="attr: {'aria-valuenow': percent, 'aria-label': ariaLabel},
                    css: {'-qualified': isQualified}">
        <span class="free-shipping-progress-fill" data-bind="style: {width: barWidth}"></span>
    </div>
    <p class="free-shipping-message" aria-live="polite" data-bind="text: message"></p>
</div>
